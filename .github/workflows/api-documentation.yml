name: Swift API documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check documentation boundaries
        run: python3 Tools/test_api_documentation.py
      - name: Generate the public reference with Swift 6.2 and DocC
        env:
          DOCUMENTATION_REF_TYPE: ${{ github.ref_type }}
          DOCUMENTATION_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 Tools/verify_package.py --compiler-track minimum
          if [ "$DOCUMENTATION_REF_TYPE" = tag ]; then
            python3 Tools/build_api_documentation.py --release "${DOCUMENTATION_REF_NAME#v}"
          else
            python3 Tools/build_api_documentation.py
          fi
      - name: Upload static reference for review and hosting
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-api-reference
          path: .build/api-documentation/site
          if-no-files-found: error
